<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SomaFitX | Tienda Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK Oficial de Mercado Pago -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>

    <style>
        :root {
            --bg-dark: #07060D;
            --bg-card: #0F0D1B;
            --purple-neon: #A000FF;
            --purple-glow: rgba(160, 0, 255, 0.4);
            --blue-neon: #00E5FF;
            --blue-glow: rgba(0, 229, 255, 0.4);
            --red-neon: #FF1744;
            --red-glow: rgba(255, 23, 68, 0.5);
            --text-light: #F0F4F8;
            --text-muted: #A0A5BA;
            --border-glow: #1A162B;
            --mp-blue: #009EE3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* HEADER & NAVBAR */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(7, 6, 13, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(160, 0, 255, 0.2);
            z-index: 1000;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            height: 48px;
            width: auto;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--purple-glow), 0 0 10px var(--blue-glow);
            border: 1px solid var(--blue-neon);
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, #FFF 30%, var(--blue-neon) 70%, var(--purple-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 18px;
            flex-wrap: wrap;
        }

            color: var(--text-light);
